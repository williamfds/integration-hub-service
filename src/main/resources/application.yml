spring:
  application:
    name: integration-hub-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/integration_hub}
    username: ${SPRING_DATASOURCE_USERNAME:hub}
    password: ${SPRING_DATASOURCE_PASSWORD:hub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
